# Name of your workflow
name: Deploy Backend to Elastic Beanstalk

# Run this *only* when you push or merge to the 'main' branch
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out your code from the 'main' branch
      - name: Checkout code
        uses: actions/checkout@v4 # Updated to v4

      # Step 2: Zip up *only* the backend folder
      - name: Create backend deployment zip
        run: |
          cd backend
          zip -r ../backend-deploy.zip .

      # Step 3: Log in to AWS (Good practice, but step 4 is what fixes the error)
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4 # Updated to v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1 # ⬇️ IMPORTANT: Make sure this region is correct ⬇️

      # Step 4: Deploy the zip file to Elastic Beanstalk
      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v21
        with:
          # --- THIS IS THE FIX FOR THE "Error" ---
          # We must pass the secrets directly to *this* action
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          
          # --- These are your existing, correct settings ---
          application_name: simplibooks-app
          environment_name: simplibooks-app-env
          region: ap-south-1 # ⬇️ IMPORTANT: Make sure this region is correct ⬇️
          
          # --- THIS IS THE FIX FOR THE "Warning" ---
          deployment_package: backend-deploy.zip # Was: zip_file